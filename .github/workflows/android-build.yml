name: Android Signed Build

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/afitech.jks

      - name: Create Gradle Properties
        run: |
          echo "STORE_FILE=afitech.jks" >> gradle.properties
          echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> gradle.properties
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> gradle.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> gradle.properties

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Signed APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AfitechTok-Signed
          path: app/build/outputs/apk/release/*.apk