name: Android Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Restore Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/afitech.jks

      - name: Create Gradle Properties
        run: |
          echo "STORE_FILE=afitech.jks" >> gradle.properties
          echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> gradle.properties
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> gradle.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> gradle.properties

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Extract Version Info
        id: version
        run: |
         VERSION=$(grep 'val appVersionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(echo $VERSION | awk -F. '{print $NF}')
      
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Build Signed APK + AAB
        run: ./gradlew assembleRelease bundleRelease
      - name: Rename AAB
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mv app/build/outputs/bundle/release/app-release.aab \
             app/build/outputs/bundle/release/AfiTech_v${VERSION}.aab
      - name: Build Metadata
        id: metadata
        run: |
          echo "build_date=$(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
          echo "commit_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Generate Release Notes
        run: |
          cat > RELEASE_NOTES.md << EOF
          ## AfiTech v${{ steps.version.outputs.version }}

          ### Build Information
          - Version Name: ${{ steps.version.outputs.version }}
          - Version Code: ${{ steps.version.outputs.version_code }}
          - Build Date: ${{ steps.metadata.outputs.build_date }}
          - Commit: ${{ steps.metadata.outputs.commit_sha }}
          - Branch: ${GITHUB_REF_NAME}

          ### Changes
          Release generated automatically by GitHub Actions.
          EOF

      - name: Check Tag Exists
        id: tagcheck
        run: |
          if git ls-remote --tags origin "v${{ steps.version.outputs.version }}" | grep .; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        if: steps.tagcheck.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: AfiTech v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            app/build/outputs/apk/release/AfiTech_v*.apk
            app/build/outputs/bundle/release/AfiTech_v*.aab
          generate_release_notes: true