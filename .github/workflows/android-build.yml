name: Android Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/afitech.jks

      - name: Create Gradle Properties
        run: |
          echo "STORE_FILE=afitech.jks" >> gradle.properties
          echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> gradle.properties
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> gradle.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> gradle.properties

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Extract Version Name
        id: version
        run: |
          VERSION=$(grep 'versionName =' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Signed APK
        run: ./gradlew assembleRelease

      - name: Check Tag Exists
        id: tagcheck
        run: |
          if git ls-remote --tags origin "v${{ steps.version.outputs.version }}" | grep .; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        if: steps.tagcheck.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: AfiTech v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk